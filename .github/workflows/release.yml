# 把「Windows 打包」某次运行产出的完整包和补丁，挂到 GitHub Releases 供人下载（下载链接长期有效，不像运行产物 30 天过期）。
# 完整包超过 GitHub 单文件 2GB 的上限，这里拆成几份 .zip.001 / .002……，用 7-Zip 打开第一份即可解压。
# 先在本机建好发布页再运行本流程：本仓库的工作流令牌新建发布会被拒（HTTP 403，原因没查清），但往已有的发布页上传文件可以。
#   git tag -a v0.1.3 <打包用的提交> -m "视频工作台 v0.1.3" && git push origin v0.1.3
#   gh release create v0.1.3 --verify-tag --title "视频工作台 Windows 版 v0.1.3" --notes "上传中"
name: 发布下载

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 「Windows 打包」运行的编号（运行页网址里 runs/ 后面的数字）
        required: true
      version:
        description: 版本号，不带 v，例如 0.1.2
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VER: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # 系统盘空间不够放 8GB 包再加拆分后的 8GB，放到 /mnt
      - name: 准备工作目录
        run: |
          sudo mkdir -p /mnt/rel && sudo chown "$USER" /mnt/rel
          df -h /mnt

      - name: 取完整包
        uses: actions/download-artifact@v4
        with:
          name: VideoWorkbench-Windows-x64-v${{ inputs.version }}
          path: /mnt/rel
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: 取升级补丁
        uses: actions/download-artifact@v4
        with:
          name: VideoWorkbench-patch-v${{ inputs.version }}
          path: /mnt/rel
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: 拆分完整包并算校验值
        working-directory: /mnt/rel
        run: |
          full="VideoWorkbench-Windows-x64-v$VER.zip"
          patch="VideoWorkbench-patch-v$VER.zip"
          ls -l
          unzip -tq "$full"
          unzip -tq "$patch"
          echo "FULL_BYTES=$(stat -c %s "$full")" >> "$GITHUB_ENV"
          echo "PATCH_BYTES=$(stat -c %s "$patch")" >> "$GITHUB_ENV"
          split -b 1900M -d -a 3 --numeric-suffixes=1 "$full" "$full."
          rm "$full"
          sha256sum "$full".* "$patch" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "PARTS=$(ls "$full".* | wc -l)" >> "$GITHUB_ENV"

      - name: 写说明
        run: |
          size=$(awk "BEGIN{printf \"%.1f\", $FULL_BYTES/1e9}")
          patch=$(awk "BEGIN{printf \"%.0f\", $PATCH_BYTES/1e6}")
          sed -e "s/__VER__/$VER/g" -e "s/__PARTS__/$PARTS/g" -e "s/__SIZE__/$size/g" -e "s/__PATCH__/$patch/g" \
            app/ci/Release-Notes.md > /mnt/rel/notes.md
          cat /mnt/rel/notes.md

      - name: 发布
        working-directory: /mnt/rel
        run: |
          tag="v$VER"
          if ! gh release view -R "$GITHUB_REPOSITORY" "$tag" >/dev/null 2>&1; then
            echo "::error::发布页 $tag 还没建。先在本机打标签并 gh release create（见本文件开头），再运行本流程。"
            exit 1
          fi
          gh release edit -R "$GITHUB_REPOSITORY" "$tag" --title "视频工作台 Windows 版 $tag" --notes-file notes.md
          gh release upload -R "$GITHUB_REPOSITORY" "$tag" VideoWorkbench-* SHA256SUMS.txt --clobber
          gh release view -R "$GITHUB_REPOSITORY" "$tag" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
