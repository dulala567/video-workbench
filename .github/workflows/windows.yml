# 在 GitHub 的 Windows 云电脑上打包「视频工作台」Windows 版，并在真机上跑一遍自检，产出可以直接发给别人的 ZIP。
name: Windows 打包

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WHISPER_TAG: b5907
  WHISPER_MODEL: ggml-large-v3-turbo-q5_0.bin
  # 数字人：MuseTalk 1.5 + RobustVideoMatting（换背景），代码固定到和 Mac 版相同的提交
  MUSETALK_SHA: 2536eaf06b85f775d8e04b7fd81bf6699155a58d
  RVM_SHA: 53d74c6826735f01f4406b5ca9075eee27bec094
  # 显卡版 PyTorch（CUDA 12.8，支持 RTX 50 系），安装包自带 CUDA 运行库，用户只要装 NVIDIA 驱动
  TORCH_INDEX: https://download.pytorch.org/whl/cu128
  TORCH_PKGS: torch==2.8.0 torchvision==0.23.0
  # 快速识别：sherpa-onnx（静态链接版，单个 exe，不依赖 VC 运行库）+ SenseVoice 小模型
  SHERPA_VER: 2.0.3
  SENSEVOICE: sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: 缓存识别模型
        id: model-cache
        uses: actions/cache@v4
        with:
          path: app/win-resources/models
          key: whisper-model-${{ env.WHISPER_MODEL }}

      - name: 下载识别模型
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force win-resources/models | Out-Null
          curl.exe -L --fail --retry 3 -o "win-resources/models/$env:WHISPER_MODEL" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$env:WHISPER_MODEL"

      - name: 下载 ffmpeg、whisper、字体
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force win-resources/bin, win-resources/fonts, $env:RUNNER_TEMP/dl | Out-Null
          $dl = "$env:RUNNER_TEMP/dl"

          # ffmpeg（gyan.dev 正式版 essentials：含 libass、x264、mp3lame、NVENC/QSV/AMF）
          curl.exe -L --fail --retry 3 -o "$dl/ffmpeg.zip" "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Expand-Archive "$dl/ffmpeg.zip" "$dl/ffmpeg"
          Get-ChildItem "$dl/ffmpeg" -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination win-resources/bin

          # whisper.cpp（OpenBLAS 版，CPU 上更快）
          curl.exe -L --fail --retry 3 -o "$dl/whisper.zip" "https://github.com/ggml-org/whisper.cpp/releases/download/$env:WHISPER_TAG/whisper-blas-bin-x64.zip"
          Expand-Archive "$dl/whisper.zip" "$dl/whisper"
          $cli = Get-ChildItem "$dl/whisper" -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          Get-ChildItem $cli.DirectoryName -Include *.exe, *.dll -File -Recurse | Where-Object { $_.DirectoryName -eq $cli.DirectoryName } | Copy-Item -Destination win-resources/bin

          # 思源黑体（Noto Sans SC，SIL OFL 开源字体），字幕默认字体
          foreach ($w in 'Regular', 'Bold') {
            curl.exe -L --fail --retry 3 -o "win-resources/fonts/NotoSansSC-$w.otf" "https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-$w.otf"
          }
          curl.exe -L --fail --retry 3 -o "win-resources/fonts/OFL.txt" "https://github.com/notofonts/noto-cjk/raw/main/Sans/LICENSE"

          Get-ChildItem win-resources -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          & win-resources/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          & win-resources/bin/whisper-cli.exe --help 2>&1 | Select-Object -First 3

      - name: 缓存快速识别（程序 + 模型）
        id: sv-cache
        uses: actions/cache@v4
        with:
          path: |
            app/win-resources/sherpa
            app/win-resources/models/sensevoice
          key: sensevoice-${{ env.SHERPA_VER }}-${{ env.SENSEVOICE }}

      - name: 下载快速识别
        if: steps.sv-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = "$env:RUNNER_TEMP/dl"
          $tar = "$env:SystemRoot/System32/tar.exe"
          New-Item -ItemType Directory -Force win-resources/sherpa, win-resources/models/sensevoice, "$dl/sherpa", "$dl/sv" | Out-Null
          curl.exe -L --fail --retry 3 -o "$dl/sherpa.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$env:SHERPA_VER/sherpa-onnx-v$env:SHERPA_VER-win-x64-static-MT-Release-no-tts.tar.bz2"
          if ($LASTEXITCODE) { throw 'sherpa-onnx 下载失败' }
          & $tar -xjf "$dl/sherpa.tar.bz2" -C "$dl/sherpa" "*/bin/sherpa-onnx-offline.exe"
          $exe = Get-ChildItem "$dl/sherpa" -Recurse -Filter sherpa-onnx-offline.exe | Select-Object -First 1
          if (-not $exe) { throw '压缩包里没找到 sherpa-onnx-offline.exe' }
          Copy-Item $exe.FullName win-resources/sherpa/
          curl.exe -L --fail --retry 3 -o "$dl/sv.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$env:SENSEVOICE.tar.bz2"
          if ($LASTEXITCODE) { throw 'SenseVoice 模型下载失败' }
          & $tar -xjf "$dl/sv.tar.bz2" -C "$dl/sv"
          foreach ($f in 'model.int8.onnx', 'tokens.txt', 'LICENSE', 'README.md') { Copy-Item "$dl/sv/$env:SENSEVOICE/$f" win-resources/models/sensevoice/ }
          $want = @{ 'model.int8.onnx' = 'c71f0ce00bec95b07744e116345e33d8cbbe08cef896382cf907bf4b51a2cd51'; 'tokens.txt' = 'f449eb28dc567533d7fa59be34e2abca8784f771850c78a47fb731a31429a1dc' }
          foreach ($k in $want.Keys) { $h = (Get-FileHash "win-resources/models/sensevoice/$k" -Algorithm SHA256).Hash.ToLower(); if ($h -ne $want[$k]) { throw "$k 校验不对：$h" } }

      - name: 检查快速识别程序
        run: |
          Get-ChildItem win-resources/sherpa, win-resources/models/sensevoice | Select-Object Name, Length | Format-Table -AutoSize
          & win-resources/sherpa/sherpa-onnx-offline.exe --help 2>&1 | Select-Object -First 3
          exit 0

      - name: 数字人 Python 环境（自带 Python 3.11 + 显卡版 PyTorch）
        run: |
          $ErrorActionPreference = 'Stop'
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          pip install uv
          $env:UV_PYTHON_PREFERENCE = 'only-managed'
          uv python install 3.11
          $src = Split-Path (uv python find 3.11)
          New-Item -ItemType Directory -Force win-resources/engines | Out-Null
          Copy-Item $src win-resources/engines/python -Recurse
          $py = (Resolve-Path win-resources/engines/python/python.exe).Path
          uv pip install --python $py --break-system-packages --index-url $env:TORCH_INDEX $env:TORCH_PKGS.Split(' ')
          if ($LASTEXITCODE) { throw 'torch 安装失败' }
          uv pip install --python $py --break-system-packages "numpy<2" diffusers==0.30.2 transformers==4.39.2 accelerate==0.28.0 huggingface_hub==0.25.2 opencv-python==4.11.0.86 soundfile librosa==0.11.0 einops omegaconf face-alignment==1.5.0 tqdm imageio scipy
          if ($LASTEXITCODE) { throw '依赖安装失败' }
          # 运行用不到的 C++ 头文件和链接库，体积大、路径长（Windows 路径超 260 字会解压失败）
          $sp = 'win-resources/engines/python/Lib/site-packages'
          Remove-Item "$sp/torch/include" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$sp/torch/lib" -Filter *.lib | Remove-Item -Force
          & $py -c "import torch, torchvision, cv2, diffusers, transformers, face_alignment, librosa; print('torch', torch.__version__, 'cuda', torch.version.cuda, 'cv2', cv2.__version__)"
          if ($LASTEXITCODE) { throw '依赖导入失败' }
          "{0:N2} GB" -f ((Get-ChildItem win-resources/engines/python -Recurse -File | Measure-Object Length -Sum).Sum / 1GB)

      - name: 缓存数字人模型
        id: ls-cache
        uses: actions/cache@v4
        with:
          path: |
            app/win-resources/engines/MuseTalk/models
            app/win-resources/engines/torch-hub
            app/win-resources/engines/RobustVideoMatting/rvm_mobilenetv3.pth
          key: lipsync-models-v1

      - name: 下载数字人模型
        if: steps.ls-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $e = 'win-resources/engines'
          $m = "$e/MuseTalk/models"
          New-Item -ItemType Directory -Force "$m/musetalkV15", "$m/sd-vae", "$m/whisper", "$m/face-parse-bisent", "$e/torch-hub/checkpoints", "$e/RobustVideoMatting" | Out-Null
          function Get-File($url, $out, $sha) {
            curl.exe -L --fail --retry 3 -o $out $url
            if ($LASTEXITCODE) { throw "下载失败 $url" }
            if ($sha) { $h = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower(); if ($h -ne $sha) { throw "$out 校验不对：$h" } }
          }
          $hf = 'https://huggingface.co'
          Get-File "$hf/TMElyralab/MuseTalk/resolve/main/musetalkV15/musetalk.json" "$m/musetalkV15/musetalk.json"
          Get-File "$hf/TMElyralab/MuseTalk/resolve/main/musetalkV15/unet.pth" "$m/musetalkV15/unet.pth"
          Get-File "$hf/stabilityai/sd-vae-ft-mse/resolve/main/config.json" "$m/sd-vae/config.json"
          Get-File "$hf/stabilityai/sd-vae-ft-mse/resolve/main/diffusion_pytorch_model.bin" "$m/sd-vae/diffusion_pytorch_model.bin"
          foreach ($f in 'config.json', 'pytorch_model.bin', 'preprocessor_config.json') { Get-File "$hf/openai/whisper-tiny/resolve/main/$f" "$m/whisper/$f" }
          Get-File "$hf/ManyOtherFunctions/face-parse-bisent/resolve/main/79999_iter.pth" "$m/face-parse-bisent/79999_iter.pth" '468e13ca13a9b43cc0881a9f99083a430e9c0a38abd935431d1c28ee94b26567'
          Get-File 'https://download.pytorch.org/models/resnet18-5c106cde.pth' "$m/face-parse-bisent/resnet18-5c106cde.pth"
          # 官方 resnet18 是旧打包格式，新版 PyTorch 默认拒绝加载，转存一次
          & "$e/python/python.exe" -c "import torch,sys; p=sys.argv[1]; torch.save(torch.load(p, map_location='cpu', weights_only=False), p)" "$m/face-parse-bisent/resnet18-5c106cde.pth"
          if ($LASTEXITCODE) { throw 'resnet18 转存失败' }
          # 人脸检测（face-alignment 默认运行时联网下载，这里提前放好）
          Get-File 'https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth' "$e/torch-hub/checkpoints/s3fd-619a316812.pth" '619a31681264d3f7f7fc7a16a42cbbe8b23f31a256f75a366e5a1bcd59b33543'
          Get-File 'https://www.adrianbulat.com/downloads/python-fan/2DFAN4-11f355bf06.pth.tar' "$e/torch-hub/checkpoints/2DFAN4-11f355bf06.pth.tar" '11f355bf0693120222f5955ce3f9dc8fb5763ebb30a47d7906e509490d32e4aa'
          # 换背景抠像
          Get-File 'https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3.pth' "$e/RobustVideoMatting/rvm_mobilenetv3.pth" '3c7c1d92033f7c38d6577c481d13a195d7d80a159b960f4f3119ac7b534cf4f8'

      - name: 数字人代码
        run: |
          $ErrorActionPreference = 'Stop'
          $e = 'win-resources/engines'
          function Get-Repo($url, $sha, $dir) {
            git init -q $dir; git -C $dir fetch -q --depth 1 $url $sha; git -C $dir checkout -q FETCH_HEAD
            if ($LASTEXITCODE) { throw "拉取失败 $url" }
          }
          Get-Repo https://github.com/TMElyralab/MuseTalk.git $env:MUSETALK_SHA "$env:RUNNER_TEMP/MuseTalk"
          Get-Repo https://github.com/PeterL1n/RobustVideoMatting.git $env:RVM_SHA "$env:RUNNER_TEMP/RVM"
          Get-ChildItem "$env:RUNNER_TEMP/MuseTalk" -Force -Exclude .git, models, assets | Copy-Item -Destination "$e/MuseTalk" -Recurse -Force
          Copy-Item "$env:RUNNER_TEMP/RVM/model", "$env:RUNNER_TEMP/RVM/LICENSE" "$e/RobustVideoMatting" -Recurse -Force
          Copy-Item ../engines/lipsync_runner.py $e/
          # 快速模式用的小型解码模型 TAESD（约 10MB，MIT 许可）
          $t = "$e/MuseTalk/models/taesd"
          New-Item -ItemType Directory -Force $t | Out-Null
          $want = @{ 'config.json' = '3ebefd1aa96ac474cc6430fe6ea81febccf7ee82461715691ee9315c884adeef'; 'diffusion_pytorch_model.safetensors' = 'db169d69145ec4ff064e49d99c95fa05d3eb04ee453de35824a6d0f325513549' }
          foreach ($k in $want.Keys) {
            curl.exe -L --fail --retry 3 -o "$t/$k" "https://huggingface.co/madebyollin/taesd/resolve/main/$k"
            if ($LASTEXITCODE) { throw "TAESD $k 下载失败" }
            $h = (Get-FileHash "$t/$k" -Algorithm SHA256).Hash.ToLower(); if ($h -ne $want[$k]) { throw "TAESD $k 校验不对：$h" }
          }
          Get-ChildItem $e -Depth 1 | Select-Object FullName | Format-Table -AutoSize
          "数字人引擎合计 {0:N2} GB" -f ((Get-ChildItem $e -Recurse -File | Measure-Object Length -Sum).Sum / 1GB)

      - name: 构建并打包
        run: npm run dist:win

      - name: 真机自检（放在带中文和空格的文件夹里跑）
        run: |
          $out = "$env:RUNNER_TEMP/selftest"
          # 用户常把软件解压到带中文的文件夹，自检也这么放，才能测到路径问题
          $cn = "release/中文 文件夹-含数字人"
          New-Item -ItemType Directory -Force $cn | Out-Null
          Move-Item release/win-unpacked "$cn/app"
          $exe = (Resolve-Path "$cn/app/VideoWorkbench.exe").Path
          $face = "$env:RUNNER_TEMP/MuseTalk/assets/demo/monalisa/monalisa.png"
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test', "`"$out`"", '--sample', "`"$(Resolve-Path ci/sample_zh.mp3)`"", '--face', "`"$face`"" -PassThru -Wait
          Move-Item "$cn/app" release/win-unpacked
          Get-Content "$out/selftest.json" -Encoding utf8
          Get-ChildItem "$out" -Recurse -Filter *.log | Where-Object { $_.FullName -match '数字人输出' } | ForEach-Object { "---- $($_.Name)"; Get-Content $_.FullName -Encoding utf8 -Tail 30 }
          if ($p.ExitCode -ne 0) { throw "自检失败，退出码 $($p.ExitCode)" }

      - name: 上传自检结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            ${{ runner.temp }}/selftest/selftest.json
            ${{ runner.temp }}/selftest/*.png
          if-no-files-found: warn

      - name: 升级补丁（程序文件 + 新加的小模型，给已经装过完整包的人用）
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "VideoWorkbench-patch-v$ver"
          $r = "release/$name/resources"
          New-Item -ItemType Directory -Force "$r/engines/MuseTalk/models", "$r/models" | Out-Null
          Copy-Item release/win-unpacked/resources/app.asar "$r/"
          Copy-Item ../engines/lipsync_runner.py "$r/engines/"
          Copy-Item win-resources/engines/MuseTalk/models/taesd "$r/engines/MuseTalk/models/" -Recurse
          Copy-Item win-resources/sherpa "$r/" -Recurse
          Copy-Item win-resources/models/sensevoice "$r/models/" -Recurse
          Copy-Item ci/Patch-ReadMe.txt "release/$name/ReadMe.txt"
          7z a -tzip -mx=7 "release/$name.zip" "./release/$name/*"
          "PATCH_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item "release/$name.zip" | Select-Object Name, Length

      - name: 上传升级补丁
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PATCH_NAME }}
          path: app/release/${{ env.PATCH_NAME }}.zip
          compression-level: 0
          retention-days: 30

      - name: 压缩成 ZIP
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "VideoWorkbench-Windows-x64-v$ver"
          Rename-Item release/win-unpacked $name
          Copy-Item ci/ReadMe.txt release/$name/
          7z a -tzip -mx=5 -mmt=on "release/$name.zip" "./release/$name"
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item "release/$name.zip" | Select-Object Name, Length

      - name: 上传 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: app/release/${{ env.ZIP_NAME }}.zip
          compression-level: 0
          retention-days: 30
